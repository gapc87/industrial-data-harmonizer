name: CD Production

# Este workflow se ejecuta SOLO cuando se fusionan cambios en la rama 'main'.
# Aquí es donde configurarías el despliegue a producción (ej. Koyeb, AWS, Railway).

on:
  push:
    branches:
      - main
    # Opcional: Ignorar cambios que solo afectan documentación si ya tienes un workflow separado
    paths-ignore:
