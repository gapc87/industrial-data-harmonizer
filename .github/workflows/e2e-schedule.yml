name: E2E Tests

# Ejecución programada o manual de tests E2E (dependientes de servicios externos)
on:
  schedule:
    # Ejecutar diariamente a las 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la ejecución manual'
        required: false
        default: 'Verificación manual'

jobs:
  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: uv sync --group dev

      - name: Run E2E Tests
        env:
          # Variables ficticias requeridas por el entorno, aunque E2E use externos
          POSTGRES_PASSWORD: "dummy-password"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "dummy"
          POSTGRES_DB: "dummy"
          SECRET_KEY: "dummy-secret-key-for-tests-must-be-32-chars"
          OAUTH2_CLIENT_ID: "dummy-client-id"
          OAUTH2_CLIENT_SECRET: "dummy-client-secret-at-least-32-chars-long"
          MTLS_CERT_PATH: "/tmp/dummy-cert.pem"
        run: |
          # Install 'just' task runner
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin

          echo "Iniciando tests E2E..."
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Motivo: ${{ inputs.reason }}"
          fi

          # Run ONLY E2E tests
          just test-e2e
