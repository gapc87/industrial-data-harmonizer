name: CI Quality Gate
on:
  pull_request:
    branches: [ main, dev ]

jobs:
  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce GitFlow (Main Restriction)
        if: github.base_ref == 'main'
        run: |
          echo "Merging into main..."
          SOURCE_BRANCH="${{ github.head_ref }}"
          echo "Source Branch: $SOURCE_BRANCH"

          # Regex: Permite 'dev' O 'hotfix/...'
          if [[ ! "$SOURCE_BRANCH" =~ ^(dev|hotfix/.*)$ ]]; then
            echo "::error::Solo se permite merge a 'main' desde la rama 'dev' o 'hotfix/'. Tu rama es '$SOURCE_BRANCH'."
            exit 1
          fi
          echo "Branch check passed!"

      - name: Install deps
        run: uv sync --group dev

      - name: Export OpenAPI JSON
        env:
          SECRET_KEY: "dummy-secret-key-for-build-environment-32chars"
          POSTGRES_PASSWORD: "dummy-password"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "dummy"
          POSTGRES_DB: "dummy"
          OAUTH2_CLIENT_ID: "dummy-client-id"
          OAUTH2_CLIENT_SECRET: "dummy-client-secret-at-least-32-chars-long"
          MTLS_CERT_PATH: "/tmp/dummy-cert.pem"
        run: |
          uv run scripts/export_openapi.py

      - name: Run Tests
        env:
          POSTGRES_PASSWORD: "dummy-password"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "dummy"
          POSTGRES_DB: "dummy"
          SECRET_KEY: "dummy-secret-key-for-tests-must-be-32-chars"
          OAUTH2_CLIENT_ID: "dummy-client-id"
          OAUTH2_CLIENT_SECRET: "dummy-client-secret-at-least-32-chars-long"
          MTLS_CERT_PATH: "/tmp/dummy-cert.pem"
        run: uv run pytest tests/unit

      - name: Verify Docs Build
        run: uv run mkdocs build --strict
