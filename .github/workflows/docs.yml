name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Configurar Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Export OpenAPI JSON
        env:
          POSTGRES_PASSWORD: "dummy-password"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "dummy"
          POSTGRES_DB: "dummy"
          SECRET_KEY: "dummy-secret-key-for-tests-must-be-32-chars"
          OAUTH2_CLIENT_ID: "dummy-client-id"
          MTLS_CERT_PATH: "/tmp/dummy-cert.pem"
        run: |
          uv run scripts/export_openapi.py

      - name: Build & Deploy to GitHub Pages
        run: |
          uv run mkdocs gh-deploy --force
