[project]
name = "industrial-data-harmonizer"
version = "0.1.0"
description = "A robust Modular Monolith bridging the OT/IT gap. Implements Hexagonal Architecture, DDD, and Edge Computing strategies to orchestrate real-time telemetry and SAP integration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gabriel Pérez", email = "gapc87@gmail.com" }]
keywords = [
    "industrial-iot",
    "hexagonal-architecture",
    "domain-driven-design",
    "fastapi",
    "sap-integration",
    "edge-computing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Topic :: System :: Monitoring",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.128.0,<0.129.0",
    "uvicorn[standard]>=0.40.0,<1.0.0",
    "python-multipart>=0.0.22,<0.1.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.46,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.3,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "apscheduler>=3.11.2,<4.0.0",
    "xmltodict>=1.0.2,<2.0.0",
    "defusedxml>=0.7.1,<1.0.0",
    "structlog>=25.5.0,<26.0.0",
    "testcontainers[postgres]>=4.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "testcontainers[postgres]>=4.14.0,<5.0.0",
    "ruff>=0.14.0,<1.0.0",
    "mypy>=1.19.0,<2.0.0",
    "types-requests>=2.32.0,<3.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.1,<10.0.0",
    "mkdocs-swagger-ui-tag>=0.6.10,<1.0.0",
    "pre-commit>=4.5.1,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/gapc87/industrial-data-harmonizer"
Repository = "https://github.com/gapc87/industrial-data-harmonizer"
Documentation = "https://github.com/gapc87/industrial-data-harmonizer/blob/main/README.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (Ordenación de imports automática)
    "B",  # flake8-bugbear (Errores comunes de diseño)
    "C4", # flake8-comprehensions (Mejoras en listas/dicts)
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    # Ignorar warning de testcontainers 4.x que aparece al importar waiting_utils
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/idh"]
